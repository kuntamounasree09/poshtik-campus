<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Poshtik Campus — Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="images/poshtik-logo.png" alt="Poshtik Campus logo" width="180">
        <h1>Poshtik Campus Menu</h1>
        <p>Healthy Food, Healthy Body, Healthy Mind</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
    </nav>

    <main>

        <h2>Today's Healthy Ten</h2>

        <section id="dish-list"></section>

        <h2>Order Here</h2>

        <form id="order-form" novalidate>

            <label for="cust-name">Your name</label>
            <input type="text" id="cust-name">

            <label for="cust-phone">Phone number</label>
            <input type="text" id="cust-phone">

            <fieldset>
                <legend>Pick your dish</legend>

                <label>
                    <input type="radio" name="dish" id="dish-0">
                    Jonna Rotte Wrap
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-1">
                    Sajja Roti Wrap
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-2">
                    Ragi Sangati Bowl
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-3">
                    Ragi Idli Bowl
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-4">
                    Pesarattu with Sprouts
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-5">
                    Ulava Charu Protein Bowl
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-6">
                    Gongura Sprouts Salad
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-7">
                    Sprouts Moong Chilla
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-8">
                    Paneer Protein Bowl
                </label>

                <label>
                    <input type="radio" name="dish" id="dish-9">
                    Millet Protein Shake
                </label>

            </fieldset>

            <label for="qty">Quantity</label>
            <input type="number" id="qty" min="1" max="10">

            <label for="notes">Notes for the kitchen</label>
            <textarea id="notes" rows="3"></textarea>

            <p>
                <button type="submit">Place order</button>
            </p>

        </form>

        <p id="order-result"></p>

    </main>

    <footer>
        <p>© 2026 Poshtik Campus · orders@poshtikcampus.in</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
